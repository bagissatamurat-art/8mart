name: mart8
description: 8mart — цветы и букеты с доставкой и самовывозом; также товары для дома, подарки, стройматериалы. iOS + Android.
publish_to: none
version: 1.4.0+14

environment:
  # Как в pubspec.lock: зависимости требуют Flutter 3.44+ / Dart 3.12+.
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^8.1.6
  hydrated_bloc: ^9.1.5
  equatable: ^2.0.5
  path_provider: ^2.1.3
  go_router: ^14.2.0
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  # Карта: нативный Mapbox Maps SDK (iOS 14+, Android). Публичный токен pk.* — через --dart-define MAPBOX_ACCESS_TOKEN.
  mapbox_maps_flutter: ^2.31.1
  http: ^1.2.2
  # «Моё местоположение» на карте выбора адреса. Разрешения: iOS NSLocationWhenInUseUsageDescription, Android ACCESS_FINE/COARSE_LOCATION.
  geolocator: ^14.0.2
  # Видео-сторис 8mart.kz (GET /public/stories, type video).
  video_player: ^2.14.1
  # Подключить, когда будут ключи/проекты:
  # firebase_core: ^3.3.0
  # firebase_messaging: ^15.0.4
  # connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Скриншоты для сторов: integration_test/store_screenshots_test.dart
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    # Вариативный шрифт: одно начертание на все веса 400–800 (FontWeight задаётся в стилях).
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
