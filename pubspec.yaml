name: mart8
description: 8mart — стройматериалы, инструменты, товары для дома, подарки и цветы. iOS + Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^8.1.6
  hydrated_bloc: ^9.1.5
  equatable: ^2.0.5
  path_provider: ^2.1.3
  go_router: ^14.2.0
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  # Карта: flutter_map + тайлы Mapbox — одна реализация для iOS, Android и браузера.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  # Подключить, когда будут ключи/проекты:
  # firebase_core: ^3.3.0
  # firebase_messaging: ^15.0.4
  # connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    # Вариативный шрифт: одно начертание на все веса 400–800 (FontWeight задаётся в стилях).
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
