<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet"></helmet>
<div style="display:grid;grid-template-columns:{{ imgW }}px minmax(0,1fr) auto;gap:{{ gap }}px;align-items:center;padding:{{ pad }};border-radius:16px;background:{{ bg }};font-family:Onest,system-ui,sans-serif;color:#17151A;box-sizing:border-box;width:100%">
  <div style="position:relative;width:{{ imgW }}px;height:{{ imgW }}px;border-radius:12px;background:#F7F7F8;overflow:hidden;flex:none"><img src="{{ img }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;opacity:{{ imgOp }}"><sc-if value="{{ soldOut }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:3px 8px;border-radius:999px;background:#17151A;color:#fff;font-size:11px;font-weight:600;white-space:nowrap">Раскупили</span></sc-if></div>
  <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
    <span style="font-size:15px;line-height:1.3;color:{{ nameColor }};display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ name }}</span>
    <span style="font-size:13px;color:#9E9BA6">{{ meta }}</span>
    <sc-if value="{{ hasBonus }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#13824D"><span style="width:12px;height:12px;border-radius:50%;background:#1DA765;color:#fff;font-size:8px;font-weight:800;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none;font-family:Onest,system-ui,sans-serif">Б</span>{{ bonusText }}</span></sc-if>
    <sc-if value="{{ soldOut }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ remove }}" style="align-self:flex-start;border:0;background:transparent;padding:0;font:inherit;font-size:14px;font-weight:600;color:#EE1D74;cursor:pointer">Удалить из корзины</button></sc-if>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none">
    <sc-if value="{{ active }}" hint-placeholder-val="{{ true }}">
      <span style="display:flex;align-items:baseline;gap:6px"><span style="font-size:16px;font-weight:700;white-space:nowrap">{{ sum }}</span><sc-if value="{{ hasOld }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:#9E9BA6;text-decoration:line-through;white-space:nowrap">{{ oldSum }}</span></sc-if></span>
      <dc-import name="MartStepper" qty="{{ qty }}" size="36" tone="neutral" max="{{ max }}" on-change="{{ change }}" hint-size="100px,36px"></dc-import>
    </sc-if>
    <sc-if value="{{ soldOut }}" hint-placeholder-val="{{ false }}">
      <span style="font-size:13px;color:#9E9BA6">не учитывается</span>
      <button type="button" onClick="{{ remove }}" aria-label="Удалить" style="width:36px;height:36px;border-radius:50%;border:0;background:#F7F7F8;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0" style-hover="background:#EEEDF1"><span style="position:relative;width:12px;height:12px;display:block"><span style="position:absolute;left:0;top:5px;width:12px;height:2px;background:#6B6873;transform:rotate(45deg)"></span><span style="position:absolute;left:0;top:5px;width:12px;height:2px;background:#6B6873;transform:rotate(-45deg)"></span></span></button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:110},
&quot;product&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;id&quot;:&quot;b1&quot;,&quot;name&quot;:&quot;Цемент М400, 50 кг&quot;,&quot;weight&quot;:&quot;50 кг&quot;,&quot;price&quot;:2890,&quot;oldPrice&quot;:3290,&quot;img&quot;:&quot;./assets/b-cement.png&quot;},&quot;tsType&quot;:&quot;Product&quot;},
&quot;qty&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;tsType&quot;:&quot;number&quot;},
&quot;max&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:99,&quot;tsType&quot;:&quot;number&quot;},
&quot;soldOut&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},
&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},
&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string, qty:number)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { D: null };
  componentDidMount() { import('./data.js').then(D => this.setState({ D })); }
  renderVals() {
    const p = this.props, D = this.state.D, pr = p.product || {}, qty = Number(p.qty ?? 1), soldOut = !!p.soldOut;
    const money = (n) => D ? D.money(n) : '';
    const compact = !!p.compact;
    return {
      imgW: compact ? 64 : 80, gap: compact ? 12 : 16, pad: compact ? '8px' : '12px', bg: soldOut ? '#F7F7F8' : '#FFFFFF',
      img: pr.img, imgOp: soldOut ? .45 : 1, name: pr.name ?? '', nameColor: soldOut ? '#9E9BA6' : '#17151A',
      meta: soldOut ? 'Нет в наличии в вашем филиале' : `${pr.weight || ''} · ${money(pr.price)} за шт`,
      hasBonus: !!pr.bonus && !soldOut, bonusText: pr.bonus && D ? D.bonusText(pr.bonus * qty) : '',
      soldOut, active: !soldOut, qty, max: p.max ?? 99,
      sum: money((pr.price || 0) * qty), hasOld: !!pr.oldPrice, oldSum: money((pr.oldPrice || 0) * qty),
      change: (q) => p.onChange && p.onChange(pr.id, q), remove: () => p.onChange && p.onChange(pr.id, 0),
    };
  }
}
</script>
</body>
</html>
