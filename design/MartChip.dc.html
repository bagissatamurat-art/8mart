<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet"></helmet>
<button type="button" onClick="{{ onClick }}" disabled="{{ disabled }}" style="display:inline-flex;align-items:center;gap:6px;height:{{ h }}px;padding:0 14px;border-radius:999px;border:1.5px solid {{ bc }};background:{{ bg }};color:{{ fg }};font-family:Onest,system-ui,sans-serif;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s ease" style-hover="background:{{ bgHover }}">
  <span>{{ label }}</span>
  <sc-if value="{{ hasCount }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;opacity:.7">{{ count }}</span></sc-if>
  <sc-if value="{{ removable }}" hint-placeholder-val="{{ false }}"><span style="position:relative;width:12px;height:12px;display:block;margin-left:2px"><span style="position:absolute;left:0;top:5px;width:12px;height:2px;background:currentColor;border-radius:1px;transform:rotate(45deg)"></span><span style="position:absolute;left:0;top:5px;width:12px;height:2px;background:currentColor;border-radius:1px;transform:rotate(-45deg)"></span></span></sc-if>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:60},
&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Розы&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},
&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},
&quot;removable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},
&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number&quot;},
&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:36,&quot;options&quot;:[36,40],&quot;tsType&quot;:&quot;36|40&quot;},
&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, sel = !!p.selected, dis = !!p.disabled;
    return {
      h: Number(p.size ?? 36), label: p.label ?? 'Чип', onClick: p.onClick, disabled: dis,
      bg: dis ? '#F7F7F8' : sel ? '#17151A' : '#FFFFFF', bgHover: dis ? '#F7F7F8' : sel ? '#17151A' : '#F7F7F8',
      fg: dis ? '#9E9BA6' : sel ? '#FFFFFF' : '#17151A', bc: dis ? '#EEEDF1' : sel ? '#17151A' : '#E3E2E7',
      hasCount: p.count != null, count: p.count, removable: !!p.removable,
    };
  }
}
</script>
</body>
</html>
