<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet"></helmet>
<div style="display:flex;flex-direction:column;gap:6px;font-family:Onest,system-ui,sans-serif;width:100%">
  <div style="position:relative;box-sizing:border-box;height:{{ h }}px;border-radius:16px;background:{{ bg }};border:1.5px solid {{ bc }};box-shadow:{{ ring }};transition:border-color .15s ease,box-shadow .15s ease">
    <label style="position:absolute;left:16px;top:{{ labelTop }}px;font-size:{{ labelFs }}px;line-height:1.2;color:{{ labelColor }};pointer-events:none;transition:all .15s ease;display:flex;gap:3px">{{ label }}<sc-if value="{{ required }}" hint-placeholder-val="{{ false }}"><span style="color:#E23D3D">*</span></sc-if></label>
    <sc-if value="{{ isArea }}" hint-placeholder-val="{{ false }}">
      <textarea value="{{ value }}" onChange="{{ onInput }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" disabled="{{ disabled }}" style="position:absolute;inset:0;width:100%;height:100%;box-sizing:border-box;padding:28px {{ padR }}px 10px 16px;border:0;background:transparent;outline:none;resize:none;font:inherit;font-size:16px;line-height:1.35;color:{{ fg }}"></textarea>
    </sc-if>
    <sc-if value="{{ isInput }}" hint-placeholder-val="{{ true }}">
      <input type="{{ inputType }}" inputMode="{{ inputMode }}" autoComplete="{{ autoComplete }}" onKeyDown="{{ onKeyDown }}" value="{{ value }}" onChange="{{ onInput }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" disabled="{{ disabled }}" style="position:absolute;inset:0;width:100%;height:100%;box-sizing:border-box;padding:22px {{ padR }}px 0 16px;border:0;background:transparent;outline:none;font:inherit;font-size:16px;color:{{ fg }};letter-spacing:{{ ls }}">
    </sc-if>
    <sc-if value="{{ showClear }}" hint-placeholder-val="{{ false }}">
      <button type="button" onMouseDown="{{ clear }}" aria-label="Очистить" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:#F7F7F8;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0" style-hover="background:#EEEDF1"><span style="position:relative;width:14px;height:14px;display:block"><span style="position:absolute;left:0;top:6px;width:14px;height:2px;background:#6B6873;border-radius:1px;transform:rotate(45deg)"></span><span style="position:absolute;left:0;top:6px;width:14px;height:2px;background:#6B6873;border-radius:1px;transform:rotate(-45deg)"></span></span></button>
    </sc-if>
  </div>
  <sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}"><div style="font-size:13px;line-height:1.3;color:{{ msgColor }};padding:0 16px">{{ msg }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:110},
&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Телефон&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;text&quot;,&quot;options&quot;:[&quot;text&quot;,&quot;phone&quot;,&quot;textarea&quot;,&quot;code&quot;],&quot;tsType&quot;:&quot;'text'|'phone'|'textarea'|'code'&quot;},
&quot;required&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},
&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;error&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string|boolean&quot;,&quot;section&quot;:&quot;State&quot;},
&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},
&quot;focused&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},
&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  componentDidUpdate(prev) { const v = this.props.value; if (v !== prev.value && v !== undefined && v !== this.state.value) this.setState({ value: v }); }
  state = { value: undefined, focus: false, D: null };
  componentDidMount() { import('./data.js').then(D => this.setState({ D })); }
  renderVals() {
    const p = this.props, D = this.state.D;
    const type = p.type ?? 'text';
    const isArea = type === 'textarea', isPhone = type === 'phone';
    const value = this.state.value ?? p.value ?? '';
    const focus = p.focused ?? this.state.focus;
    const disabled = !!p.disabled, error = !!p.error;
    const filled = String(value).length > 0;
    const up = focus || filled;
    const bc = disabled ? '#EEEDF1' : error ? '#E23D3D' : focus ? '#EE1D74' : '#E3E2E7';
    const fmt = (v) => isPhone ? (D ? D.formatPhone(v, String(value)) : v) : v;
    return {
      h: isArea ? 84 : 56, isArea, isInput: !isArea,
      inputType: type === 'code' ? 'text' : 'text', inputMode: isPhone || type === 'code' ? 'tel' : 'text',
      bg: disabled ? '#F7F7F8' : '#FFFFFF', bc, fg: disabled ? '#9E9BA6' : '#17151A',
      ring: focus && !disabled ? `0 0 0 3px ${error ? 'rgba(226,61,61,.18)' : 'rgba(238,29,116,.18)'}` : 'none',
      labelTop: up ? 9 : (isArea ? 18 : 18), labelFs: up ? 12 : 16,
      labelColor: disabled ? '#9E9BA6' : error ? '#E23D3D' : focus ? '#EE1D74' : '#6B6873',
      label: p.label ?? 'Поле', required: !!p.required, value, disabled,
      ls: type === 'code' ? '0.2em' : 'normal',
      padR: !isPhone && filled ? 52 : 16,
      showClear: !isPhone && !disabled && focus && filled,
      hasMsg: error || !!p.hint, msg: error ? (p.error === true ? 'Обязательное поле' : p.error) : p.hint, msgColor: error ? '#E23D3D' : '#6B6873',
      onInput: (e) => { const v = fmt(e.target.value); this.setState({ value: v }); p.onChange && p.onChange(v); },
      onFocus: (e) => { this.setState({ focus: true }); p.onFocus && p.onFocus(e); }, onBlur: (e) => { this.setState({ focus: false }); p.onBlur && p.onBlur(e); },
      onKeyDown: (e) => { p.onKeyDown && p.onKeyDown(e); }, autoComplete: p.autoComplete ?? 'on',
      clear: (e) => { e.preventDefault(); this.setState({ value: '' }); p.onChange && p.onChange(''); },
    };
  }
}
</script>
</body>
</html>
