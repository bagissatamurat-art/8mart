<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet"></helmet>
<aside style="background:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px;font-family:Onest,system-ui,sans-serif;color:#17151A;box-sizing:border-box;width:100%">
  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 0;text-align:center"><span style="width:96px;height:96px;border-radius:50%;background:#FDF0F6;display:flex;align-items:center;justify-content:center;overflow:hidden"><img src="./assets/empty-cart.png" alt="" style="width:60px;height:60px"></span><b style="font-size:16px">Корзина пуста</b><span style="font-size:14px;color:#6B6873;line-height:1.4">Добавьте товары — покажем сумму и доставку здесь</span></div>
  </sc-if>
  <sc-if value="{{ has }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:baseline;justify-content:space-between"><b style="font-size:18px">{{ title }}</b><a href="{{ cartHref }}" style="font-size:14px;font-weight:600;text-decoration:none;color:#EE1D74">Открыть</a></div>
    <div style="display:flex;flex-direction:column;gap:12px;max-height:{{ listMax }};overflow-y:auto">
      <sc-for list="{{ lines }}" as="l" hint-placeholder-count="3">
        <div style="display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center"><img src="{{ l.img }}" alt="" style="width:56px;height:56px;border-radius:12px;object-fit:cover;background:#F7F7F8"><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ l.name }}</span><span style="font-size:13px;color:#6B6873">{{ l.sum }}</span></span><dc-import name="MartStepper" qty="{{ l.qty }}" size="36" tone="neutral" on-change="{{ l.change }}" hint-size="100px,36px"></dc-import></div>
      </sc-for>
    </div>
    <div style="height:1px;background:#EEEDF1"></div>
    <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">
      <div style="display:flex;justify-content:space-between"><span style="color:#6B6873">Товары</span><span>{{ goodsText }}</span></div>
      <sc-for list="{{ fees }}" as="f" hint-placeholder-count="1"><div style="display:flex;justify-content:space-between;gap:12px"><span style="color:#6B6873">{{ f.label }}</span><span style="color:{{ f.color }};white-space:nowrap">{{ f.text }}</span></div></sc-for>
    </div>
    <sc-if value="{{ showProgress }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:6px;border-radius:3px;background:#F2F2F4;overflow:hidden"><div style="height:100%;width:{{ progress }};background:#1DA765;border-radius:3px"></div></div><span style="font-size:13px;color:#6B6873">{{ progressText }}</span></div></sc-if>
    <a href="{{ cartHref }}" style="text-decoration:none"><dc-import name="MartButton" label="Оформить" amount="{{ totalText }}" size="56" full="{{ true }}" hint-size="100%,56px"></dc-import></a>
  </sc-if>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:520},&quot;cart&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;b1&quot;:2,&quot;b6&quot;:1,&quot;b4&quot;:1},&quot;tsType&quot;:&quot;Record&lt;string,number&gt;&quot;},&quot;method&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;delivery&quot;,&quot;options&quot;:[&quot;delivery&quot;,&quot;pickup&quot;],&quot;tsType&quot;:&quot;'delivery'|'pickup'&quot;},&quot;together&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;cartHref&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;listMax&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(key:string, qty:number)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { D: null };
  componentDidMount() { import('./data.js').then(D => this.setState({ D })); }
  renderVals() {
    const p = this.props, D = this.state.D, cart = p.cart || {}, method = p.method || 'delivery';
    const money = (n) => D ? D.money(n) : '';
    const lines = D ? Object.keys(cart).map(k => { const x = D.cartItem(k); return x ? { p: x, qty: cart[k] } : null; }).filter(Boolean) : [];
    const goods = lines.reduce((s, l) => s + (l.p.price || 0) * l.qty, 0), count = lines.reduce((s, l) => s + l.qty, 0);
    const plan = D && lines.length ? D.planShipments(lines, { method, together: !!p.together, goodsTotal: goods }) : { list: [], fee: 0, multi: false, hasCourierFee: false };
    const fees = method === 'pickup' ? [{ label: 'Самовывоз', text: 'Бесплатно', color: '#1DA765' }] : plan.list.map(x => ({ label: x.feeLabel, text: x.feeText, color: x.feeColor }));
    const left = D ? Math.max(0, D.DELIVERY.freeFrom - goods) : 0;
    return {
      empty: !!D && count === 0, has: count > 0, title: D ? D.itemsTitle(count) : '', cartHref: p.cartHref ?? '02 Корзина.dc.html', listMax: p.listMax ?? '288px',
      lines: lines.map(l => ({ img: l.p.img, name: l.p.name, qty: l.qty, sum: money((l.p.price || 0) * l.qty), change: (q) => p.onChange && p.onChange(l.p.id, q) })),
      goodsText: money(goods), fees, totalText: money(goods + plan.fee),
      showProgress: !!D && method !== 'pickup' && plan.hasCourierFee, progress: D ? Math.min(100, Math.round(goods / D.DELIVERY.freeFrom * 100)) + '%' : '0%',
      progressText: (plan.multi ? 'До бесплатной доставки курьером ' : 'До бесплатной доставки ') + money(left).replace('тг.', 'тг'),
    };
  }
}
</script>
</body>
</html>
