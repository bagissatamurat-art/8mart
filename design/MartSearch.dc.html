<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet"></helmet>
<div style="display:flex;flex-direction:column;gap:{{ gap }};width:100%;box-sizing:border-box;background:#fff;border-radius:{{ radius }};padding:{{ pad }};box-shadow:{{ shadow }};font-family:Onest,system-ui,sans-serif;color:#17151A;max-height:{{ maxH }};overflow:auto">
  <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
    <sc-if value="{{ hasRecent }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:4px">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 12px"><span style="font-size:12px;font-weight:600;color:#9E9BA6;letter-spacing:.04em;text-transform:uppercase">Вы искали</span><button type="button" onClick="{{ clearRecent }}" style="border:0;background:transparent;font:inherit;font-size:13px;color:#6B6873;cursor:pointer;padding:0">Очистить</button></div>
        <sc-for list="{{ recent }}" as="r" hint-placeholder-count="3">
          <button type="button" onClick="{{ r.pick }}" style="display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border:0;border-radius:12px;background:transparent;font:inherit;font-size:15px;color:#17151A;cursor:pointer;text-align:left" style-hover="background:#F7F7F8"><span style="width:16px;height:16px;border:2px solid #9E9BA6;border-radius:50%;box-sizing:border-box;position:relative;flex:none"><span style="position:absolute;left:5px;top:2px;width:2px;height:5px;background:#9E9BA6"></span><span style="position:absolute;left:5px;top:6px;width:4px;height:2px;background:#9E9BA6"></span></span>{{ r.text }}</button>
        </sc-for>
      </div>
    </sc-if>
    <div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:12px;font-weight:600;color:#9E9BA6;letter-spacing:.04em;text-transform:uppercase;padding:4px 12px">Часто ищут</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;padding:4px 12px 8px">
        <sc-for list="{{ popular }}" as="t" hint-placeholder-count="5"><dc-import name="MartChip" label="{{ t.text }}" on-click="{{ t.pick }}" hint-size="90px,36px"></dc-import></sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ false }}">
    <sc-if value="{{ hasCats }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ cats }}" as="c" hint-placeholder-count="1">
          <button type="button" onClick="{{ c.pick }}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px;padding:0 12px;border:0;border-radius:12px;background:transparent;font:inherit;font-size:15px;color:#17151A;cursor:pointer;text-align:left" style-hover="background:#F7F7F8"><span style="display:flex;align-items:center;gap:12px"><span style="width:16px;height:16px;display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:none"><span style="border:1.5px solid #9E9BA6;border-radius:3px"></span><span style="border:1.5px solid #9E9BA6;border-radius:3px"></span><span style="border:1.5px solid #9E9BA6;border-radius:3px"></span><span style="border:1.5px solid #9E9BA6;border-radius:3px"></span></span><span>{{ c.name }}<span style="color:#9E9BA6"> · {{ c.parent }}</span></span></span><span style="font-size:13px;color:#9E9BA6">{{ c.count }}</span></button>
        </sc-for>
      </div>
      <div style="height:1px;background:#EEEDF1;margin:0 12px"></div>
    </sc-if>
    <div style="display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
        <button type="button" onClick="{{ it.pick }}" style="display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;height:60px;padding:0 12px;border:0;border-radius:12px;background:transparent;font:inherit;cursor:pointer;text-align:left;color:#17151A" style-hover="background:#F7F7F8">
          <img src="{{ it.img }}" alt="" style="width:44px;height:44px;border-radius:10px;object-fit:cover;background:#F7F7F8">
          <span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.pre }}<b style="font-weight:700;color:#EE1D74">{{ it.hit }}</b>{{ it.post }}</span><span style="font-size:13px;color:#9E9BA6">{{ it.weight }}</span></span>
          <span style="font-size:15px;font-weight:700;white-space:nowrap">{{ it.price }}</span>
        </button>
      </sc-for>
    </div>
    <button type="button" onClick="{{ showAll }}" style="display:flex;align-items:center;justify-content:center;gap:8px;height:44px;margin:4px 12px 0;border:0;border-radius:999px;background:#F7F7F8;font:inherit;font-size:14px;font-weight:600;color:#17151A;cursor:pointer" style-hover="background:#EEEDF1">{{ allText }}<span style="width:7px;height:7px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg)"></span></button>
  </sc-if>
  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 16px;text-align:center"><b style="font-size:16px">Ничего не нашли по «{{ query }}»</b><span style="font-size:14px;color:#6B6873;line-height:1.4">Проверьте написание или попробуйте общее слово: «цемент», «краска», «розы»</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px"><sc-for list="{{ popular }}" as="t" hint-placeholder-count="3"><dc-import name="MartChip" label="{{ t.text }}" on-click="{{ t.pick }}" hint-size="90px,36px"></dc-import></sc-for></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:420},
&quot;query&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;desktop&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;tsType&quot;:&quot;'desktop'|'mobile'&quot;},
&quot;recent&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;popular&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},
&quot;onQuery&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(q:string)=&gt;void&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(product)=&gt;void&quot;},&quot;onCategory&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(slug:string)=&gt;void&quot;},&quot;onSubmit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(q:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { D: null, recent: undefined };
  componentDidMount() { import('./data.js').then(D => this.setState({ D })); }
  renderVals() {
    const p = this.props, D = this.state.D, P = D ? D.PRODUCTS : [];
    const q = (p.query || '').trim(), ql = q.toLowerCase();
    const mobile = (p.mode ?? 'desktop') === 'mobile';
    const recent = this.state.recent ?? (p.recent || ['цемент 50 кг', 'гипсокартон', 'розы']);
    const popular = p.popular || ['Цемент', 'Кирпич', 'Краска', 'Плитка', 'Розы', 'Гортензии'];
    const cats = D ? D.CATEGORIES.flatMap(c => c.sub.map(s => ({ ...s, parent: c.name }))) : [];
    const hitCats = ql ? cats.filter(c => c.name.toLowerCase().includes(ql)).map(c => ({ ...c, count: P.filter(x => x.cat === c.slug).length })) : [];
    const hits = ql ? P.filter(x => x.name.toLowerCase().includes(ql)) : [];
    const money = (n) => D ? D.money(n) : '';
    const emit = (text) => p.onQuery && p.onQuery(text);
    const items = hits.slice(0, mobile ? 6 : 5).map(x => { const i = x.name.toLowerCase().indexOf(ql); return { img: x.img, weight: x.weight, price: money(x.price), pre: x.name.slice(0, i), hit: x.name.slice(i, i + q.length), post: x.name.slice(i + q.length), pick: () => p.onPick && p.onPick(x) }; });
    return {
      gap: '8px', radius: mobile ? '0' : '20px', pad: mobile ? '8px 4px' : '8px', shadow: mobile ? 'none' : '0 16px 40px rgba(23,21,26,.16)', maxH: mobile ? 'none' : '560px',
      idle: !ql, hasRecent: recent.length > 0, recent: recent.map(t => ({ text: t, pick: () => emit(t) })), clearRecent: () => this.setState({ recent: [] }),
      popular: popular.map(t => ({ text: t, pick: () => emit(t) })),
      hasResults: !!ql && (hits.length > 0 || hitCats.length > 0), hasCats: hitCats.length > 0,
      cats: hitCats.slice(0, 2).map(c => ({ name: c.name, parent: c.parent, count: c.count, pick: () => p.onCategory && p.onCategory(c.slug) })),
      items, allText: `Все результаты · ${hits.length}`, showAll: () => p.onSubmit && p.onSubmit(q),
      empty: !!ql && hits.length === 0 && hitCats.length === 0, query: q,
    };
  }
}
</script>
</body>
</html>
