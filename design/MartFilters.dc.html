<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet"></helmet>
<div style="display:flex;flex-direction:column;gap:20px;font-family:Onest,system-ui,sans-serif;color:#17151A;width:100%;box-sizing:border-box">
  <div style="display:flex;flex-direction:column;gap:10px">
    <b style="font-size:15px">Цена, тг</b>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <label style="display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:14px;border:1.5px solid #E3E2E7;background:#fff"><span style="font-size:13px;color:#9E9BA6">от</span><input value="{{ min }}" onChange="{{ setMin }}" inputMode="numeric" style="width:100%;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:15px"></label>
      <label style="display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:14px;border:1.5px solid #E3E2E7;background:#fff"><span style="font-size:13px;color:#9E9BA6">до</span><input value="{{ max }}" onChange="{{ setMax }}" inputMode="numeric" style="width:100%;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:15px"></label>
    </div>
  </div>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
    <div style="display:flex;flex-direction:column;gap:6px">
      <b style="font-size:15px;margin-bottom:4px">{{ g.title }}</b>
      <sc-for list="{{ g.items }}" as="o" hint-placeholder-count="3">
        <button type="button" onClick="{{ o.toggle }}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;height:36px;padding:0 4px;border:0;background:transparent;font:inherit;font-size:14px;color:#17151A;cursor:pointer;text-align:left;border-radius:8px" style-hover="background:#F7F7F8">
          <span style="display:flex;align-items:center;gap:10px"><span style="width:20px;height:20px;border-radius:6px;border:1.5px solid {{ o.bc }};background:{{ o.bg }};box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none"><span style="width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);margin-top:-2px;opacity:{{ o.op }}"></span></span>{{ o.label }}</span>
          <span style="font-size:12px;color:#9E9BA6">{{ o.count }}</span>
        </button>
      </sc-for>
    </div>
  </sc-for>
  <sc-if value="{{ showToggles }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:6px">
    <button type="button" onClick="{{ toggleStock }}" style="display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 4px;border:0;background:transparent;font:inherit;font-size:14px;color:#17151A;cursor:pointer;border-radius:8px" style-hover="background:#F7F7F8"><span>Только в наличии</span><span style="width:40px;height:24px;border-radius:12px;background:{{ swBg }};position:relative;transition:background .15s ease;flex:none"><span style="position:absolute;top:2px;left:{{ swX }}px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(23,21,26,.2);transition:left .15s ease"></span></span></button>
    <button type="button" onClick="{{ toggleSale }}" style="display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 4px;border:0;background:transparent;font:inherit;font-size:14px;color:#17151A;cursor:pointer;border-radius:8px" style-hover="background:#F7F7F8"><span>Со скидкой</span><span style="width:40px;height:24px;border-radius:12px;background:{{ slBg }};position:relative;transition:background .15s ease;flex:none"><span style="position:absolute;top:2px;left:{{ slX }}px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(23,21,26,.2);transition:left .15s ease"></span></span></button>
  </div></sc-if>
  <sc-if value="{{ showActions }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:8px;padding-top:4px">
      <dc-import name="MartButton" label="Показать" amount="{{ resultText }}" size="44" full="{{ true }}" on-click="{{ apply }}" hint-size="100%,44px"></dc-import>
      <sc-if value="{{ hasActive }}" hint-placeholder-val="{{ false }}"><dc-import name="MartButton" label="Сбросить" variant="ghost" size="44" full="{{ true }}" on-click="{{ reset }}" hint-size="100%,44px"></dc-import></sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:560},
&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{min:string,max:string,brands:string[],packs:string[],inStock:boolean,sale:boolean}&quot;},
&quot;groups&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{key:string,title:string,items:[string,number][]}[]&quot;},
&quot;resultCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;},
&quot;resultText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;showToggles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},
&quot;showActions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},
&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v)=&gt;void&quot;},&quot;onApply&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { v: null };
  emit(v) { this.setState({ v }); this.props.onChange && this.props.onChange(v); }
  renderVals() {
    const p = this.props;
    const v = p.value || this.state.v || { min: '', max: '', brands: [], packs: [], inStock: false, sale: false };
    const groups = (p.groups || [{ key: 'brands', title: 'Производитель', items: [['Heidelberg', 4], ['Knauf', 3], ['Alina', 2], ['Standart Cement', 2]] }, { key: 'packs', title: 'Фасовка', items: [['до 5 кг', 3], ['25 кг', 6], ['50 кг', 2]] }]).map(g => ({
      title: g.title, items: g.items.map(([label, count]) => { const on = (v[g.key] || []).includes(label); return { label, count, bc: on ? '#EE1D74' : '#E3E2E7', bg: on ? '#EE1D74' : '#fff', op: on ? 1 : 0,
        toggle: () => emitToggle(g.key, label) }; }) }));
    const emitToggle = (k, l) => { const arr = v[k] || []; this.emit({ ...v, [k]: arr.includes(l) ? arr.filter(x => x !== l) : arr.concat(l) }); };
    const hasActive = Object.values(v).some(x => Array.isArray(x) ? x.length : !!x);
    const n = p.resultCount ?? 0;
    return {
      min: v.min, max: v.max, setMin: (e) => this.emit({ ...v, min: e.target.value.replace(/\D/g, '') }), setMax: (e) => this.emit({ ...v, max: e.target.value.replace(/\D/g, '') }),
      groups, toggleStock: () => this.emit({ ...v, inStock: !v.inStock }), toggleSale: () => this.emit({ ...v, sale: !v.sale }),
      swBg: v.inStock ? '#EE1D74' : '#E3E2E7', swX: v.inStock ? 18 : 2, slBg: v.sale ? '#EE1D74' : '#E3E2E7', slX: v.sale ? 18 : 2,
      showActions: p.showActions ?? true, showToggles: p.showToggles ?? true, hasActive, resultText: p.resultText ?? `${n}`,
      apply: () => p.onApply && p.onApply(v), reset: () => this.emit(Object.fromEntries(Object.keys(v).map(k => [k, Array.isArray(v[k]) ? [] : typeof v[k] === 'boolean' ? false : '']))),
    };
  }
}
</script>
</body>
</html>
