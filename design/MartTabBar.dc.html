<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet"></helmet>
<nav style="display:grid;grid-template-columns:repeat(4,1fr);height:84px;padding:8px 8px 20px;box-sizing:border-box;background:#FFFFFF;border-top:1px solid #EEEDF1;font-family:Onest,system-ui,sans-serif">
  <a href="{{ homeHref }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:{{ cHome }};font-size:11px;font-weight:600"><span style="width:22px;height:22px;border:2.5px solid currentColor;border-radius:7px 7px 4px 4px;box-sizing:border-box;position:relative"><span style="position:absolute;left:6px;bottom:0;width:5px;height:8px;background:currentColor;border-radius:2px 2px 0 0"></span></span>Главная</a>
  <a href="{{ catalogHref }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:{{ cCatalog }};font-size:11px;font-weight:600"><span style="width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:3px"><span style="border:2.5px solid currentColor;border-radius:4px;box-sizing:border-box"></span><span style="border:2.5px solid currentColor;border-radius:4px;box-sizing:border-box"></span><span style="border:2.5px solid currentColor;border-radius:4px;box-sizing:border-box"></span><span style="border:2.5px solid currentColor;border-radius:4px;box-sizing:border-box"></span></span>Каталог</a>
  <a href="{{ cartHref }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:{{ cCart }};font-size:11px;font-weight:600;position:relative"><span style="width:22px;height:22px;position:relative"><span style="position:absolute;left:1px;top:6px;width:20px;height:14px;border:2.5px solid currentColor;border-radius:3px 3px 6px 6px;box-sizing:border-box"></span><span style="position:absolute;left:6px;top:1px;width:10px;height:8px;border:2.5px solid currentColor;border-bottom:0;border-radius:5px 5px 0 0;box-sizing:border-box"></span></span>Корзина<sc-if value="{{ hasCount }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#EE1D74;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box">{{ count }}</span></sc-if></a>
  <a href="{{ profileHref }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:{{ cProfile }};font-size:11px;font-weight:600"><span style="width:22px;height:22px;position:relative"><span style="position:absolute;left:6px;top:0;width:10px;height:10px;border:2.5px solid currentColor;border-radius:50%;box-sizing:border-box"></span><span style="position:absolute;left:1px;bottom:0;width:20px;height:9px;border:2.5px solid currentColor;border-bottom:0;border-radius:10px 10px 0 0;box-sizing:border-box"></span></span>Профиль</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:84},
&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;catalog&quot;,&quot;cart&quot;,&quot;profile&quot;],&quot;tsType&quot;:&quot;'home'|'catalog'|'cart'|'profile'&quot;},
&quot;cartCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},
&quot;homeHref&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;catalogHref&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;cartHref&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;profileHref&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, a = p.active ?? 'home', c = Number(p.cartCount ?? 0);
    const col = (k) => a === k ? '#EE1D74' : '#9E9BA6';
    return { cHome: col('home'), cCatalog: col('catalog'), cCart: col('cart'), cProfile: col('profile'), hasCount: c > 0, count: c,
      homeHref: p.homeHref ?? '#', catalogHref: p.catalogHref ?? '#', cartHref: p.cartHref ?? '#', profileHref: p.profileHref ?? '#' };
  }
}
</script>
</body>
</html>
